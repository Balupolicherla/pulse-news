<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PULSE — World News Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --ink: #0d0d0d;
    --paper: #f5f0e8;
    --cream: #ede8dc;
    --accent: #c0392b;
    --muted: #888070;
    --divider: #d4cfc4;
    --card-bg: #faf7f2;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

  /* ── HEADER ── */
  header { border-bottom: 3px double var(--ink); padding: 0 2rem; background: var(--paper); position: sticky; top: 0; z-index: 100; }
  .masthead-top { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--divider); font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--muted); letter-spacing: 0.08em; }
  .live-dot { display: inline-block; width: 7px; height: 7px; background: var(--accent); border-radius: 50%; margin-right: 5px; animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
  .masthead-title { text-align: center; padding: 0.8rem 0 0.5rem; }
  .masthead-title h1 { font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 6vw, 5rem); font-weight: 900; letter-spacing: -0.02em; line-height: 1; }
  .masthead-title h1 span { color: var(--accent); }
  .masthead-tagline { font-family: 'DM Mono', monospace; font-size: 0.68rem; letter-spacing: 0.22em; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
  .cat-ribbon { display: flex; overflow-x: auto; scrollbar-width: none; border-top: 1px solid var(--divider); margin-top: 0.4rem; }
  .cat-ribbon::-webkit-scrollbar { display: none; }
  .cat-btn { flex-shrink: 0; padding: 0.5rem 1rem; font-family: 'DM Mono', monospace; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; background: none; border: none; border-right: 1px solid var(--divider); color: var(--muted); cursor: pointer; transition: all 0.18s; white-space: nowrap; }
  .cat-btn:hover { background: var(--cream); color: var(--ink); }
  .cat-btn.active { background: var(--ink); color: var(--paper); }

  /* ── TICKER ── */
  .ticker-wrap { background: var(--ink); color: var(--paper); overflow: hidden; white-space: nowrap; padding: 0.45rem 0; margin-bottom: 1.5rem; }
  .ticker-label { display: inline-block; background: var(--accent); font-family: 'DM Mono', monospace; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 0 0.8rem; margin-right: 0.8rem; }
  .ticker-content { display: inline-block; animation: ticker 70s linear infinite; font-family: 'DM Mono', monospace; font-size: 0.72rem; letter-spacing: 0.04em; padding-left: 100%; }
  @keyframes ticker { 0%{transform:translateX(0)} 100%{transform:translateX(-100%)} }

  /* ── MAIN ── */
  main { max-width: 1400px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }
  .search-wrap { display: flex; margin-bottom: 1.5rem; border: 2px solid var(--ink); max-width: 600px; }
  .search-wrap input { flex: 1; padding: 0.65rem 1rem; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; border: none; background: var(--card-bg); color: var(--ink); outline: none; }
  .search-wrap input::placeholder { color: var(--muted); }
  .search-wrap button { padding: 0.65rem 1.2rem; background: var(--ink); color: var(--paper); border: none; font-family: 'DM Mono', monospace; font-size: 0.75rem; letter-spacing: 0.08em; cursor: pointer; transition: background 0.18s; }
  .search-wrap button:hover { background: var(--accent); }

  /* ── HERO GRID ── */
  .hero-grid { display: grid; grid-template-columns: 1fr 300px; gap: 0; border: 1px solid var(--divider); margin-bottom: 2rem; background: var(--card-bg); }
  .hero-main { padding: 1.8rem; border-right: 1px solid var(--divider); cursor: pointer; transition: background 0.18s; }
  .hero-main:hover { background: var(--cream); }
  .hero-side { display: flex; flex-direction: column; }
  .hero-side-item { padding: 1rem 1.1rem; border-bottom: 1px solid var(--divider); cursor: pointer; transition: background 0.18s; flex: 1; }
  .hero-side-item:last-child { border-bottom: none; }
  .hero-side-item:hover { background: var(--cream); }

  /* ── TAGS ── */
  .tag { display: inline-block; font-family: 'DM Mono', monospace; font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: #fff; padding: 2px 7px; margin-bottom: 0.5rem; border-radius: 2px; }
  .tag-world{background:#2c3e50} .tag-politics{background:#2980b9} .tag-technology{background:#27ae60}
  .tag-business{background:#8e44ad} .tag-science{background:#16a085} .tag-health{background:#c0392b}
  .tag-climate{background:#1abc9c} .tag-ai{background:#6c3483} .tag-sports{background:#e67e22}
  .tag-entertainment{background:#d35400} .tag-default{background:#555}

  /* ── TYPOGRAPHY ── */
  .hero-headline { font-family: 'Playfair Display', serif; font-size: clamp(1.4rem, 2.5vw, 2.2rem); font-weight: 700; line-height: 1.25; margin-bottom: 0.6rem; }
  .hero-meta { font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--muted); margin-bottom: 0.8rem; letter-spacing: 0.04em; }
  .hero-summary { font-size: 0.95rem; line-height: 1.7; color: #3a3530; }
  .side-headline { font-family: 'Playfair Display', serif; font-size: 0.95rem; font-weight: 700; line-height: 1.35; margin-bottom: 3px; }
  .side-meta { font-family: 'DM Mono', monospace; font-size: 0.62rem; color: var(--muted); }

  /* ── NEWS GRID ── */
  .section-label { font-family: 'DM Mono', monospace; font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); border-top: 2.5px solid var(--ink); padding-top: 0.5rem; margin-bottom: 1rem; }
  .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1px; background: var(--divider); border: 1px solid var(--divider); margin-bottom: 2rem; }
  .news-card { background: var(--card-bg); padding: 1.2rem; cursor: pointer; transition: background 0.18s; display: flex; flex-direction: column; gap: 5px; }
  .news-card:hover { background: var(--cream); }
  .card-headline { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 700; line-height: 1.38; }
  .card-summary { font-size: 0.84rem; line-height: 1.6; color: #4a4540; flex: 1; }
  .card-meta { font-family: 'DM Mono', monospace; font-size: 0.62rem; color: var(--muted); }
  .card-link { font-family: 'DM Mono', monospace; font-size: 0.62rem; color: var(--accent); text-decoration: none; word-break: break-all; }
  .card-link:hover { text-decoration: underline; }

  /* ── LOADING ── */
  .loading-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5rem; gap: 1rem; }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--divider); border-top-color: var(--ink); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .loading-text { font-family: 'DM Mono', monospace; font-size: 0.75rem; color: var(--muted); letter-spacing: 0.12em; }

  /* ── MODAL ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(13,13,13,0.6); z-index: 500; align-items: center; justify-content: center; padding: 1rem; }
  .modal-overlay.active { display: flex; }
  .modal { background: var(--paper); border: 2px solid var(--ink); max-width: 700px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 2rem; position: relative; animation: slideUp 0.25s ease; }
  @keyframes slideUp { from{transform:translateY(16px);opacity:0} to{transform:translateY(0);opacity:1} }
  .modal-close { position: absolute; top: 1rem; right: 1.2rem; background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--muted); }
  .modal-title { font-family: 'Playfair Display', serif; font-size: clamp(1.3rem, 2.5vw, 1.9rem); font-weight: 700; line-height: 1.3; margin: 0.6rem 0; }
  .modal-meta { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--muted); margin-bottom: 1.2rem; }
  .modal-body { font-size: 0.97rem; line-height: 1.8; color: #2a2520; border-top: 1px solid var(--divider); padding-top: 1rem; }
  .modal-body p { margin-bottom: 0.9em; }
  .modal-source { margin-top: 1.2rem; padding-top: 0.8rem; border-top: 1px solid var(--divider); font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--muted); }
  .modal-source a { color: var(--accent); }

  /* ── ERROR ── */
  .error-box { padding: 3rem; text-align: center; border: 1px solid var(--divider); background: var(--card-bg); }
  .error-box .big { font-family: 'Playfair Display', serif; font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--accent); }
  .error-box p { font-family: 'DM Mono', monospace; font-size: 0.78rem; color: var(--muted); line-height: 1.7; }

  /* ── FOOTER ── */
  footer { border-top: 3px double var(--ink); padding: 1.2rem 2rem; text-align: center; font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--muted); letter-spacing: 0.08em; }

  /* ── RESPONSIVE ── */
  @media(max-width:860px) {
    .hero-grid { grid-template-columns: 1fr; }
    .hero-main { border-right: none; border-bottom: 1px solid var(--divider); }
    .hero-side { flex-direction: row; overflow-x: auto; }
    .hero-side-item { min-width: 220px; border-right: 1px solid var(--divider); border-bottom: none; }
  }
  @media(max-width:560px) {
    header { padding: 0 1rem; } main { padding: 1rem 1rem 3rem; }
    .hero-side { flex-direction: column; }
    .hero-side-item { min-width: unset; }
  }
</style>
</head>
<body>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="masthead-top">
    <span><span class="live-dot"></span>LIVE INTELLIGENCE</span>
    <span id="clock"></span>
    <span>AI-POWERED · GLOBAL COVERAGE</span>
  </div>
  <div class="masthead-title">
    <h1>PUL<span>S</span>E</h1>
    <div class="masthead-tagline">World News Intelligence Platform</div>
  </div>
  <nav class="cat-ribbon" id="catRibbon">
    <button class="cat-btn active" data-cat="Top Stories">Top Stories</button>
    <button class="cat-btn" data-cat="World">World</button>
    <button class="cat-btn" data-cat="Politics">Politics</button>
    <button class="cat-btn" data-cat="Technology">Technology</button>
    <button class="cat-btn" data-cat="Business">Business</button>
    <button class="cat-btn" data-cat="Science">Science</button>
    <button class="cat-btn" data-cat="Health">Health</button>
    <button class="cat-btn" data-cat="Climate">Climate</button>
    <button class="cat-btn" data-cat="AI">AI</button>
    <button class="cat-btn" data-cat="Sports">Sports</button>
    <button class="cat-btn" data-cat="Entertainment">Entertainment</button>
  </nav>
</header>

<!-- TICKER -->
<div class="ticker-wrap">
  <span class="ticker-label">BREAKING</span>
  <span class="ticker-content" id="ticker">Loading live headlines…</span>
</div>

<!-- MAIN -->
<main>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search any topic, region, or event…"/>
    <button onclick="doSearch()">SEARCH</button>
  </div>
  <div id="heroSection"></div>
  <div class="section-label" id="moreLabel">MORE STORIES</div>
  <div id="gridSection"></div>
</main>

<footer>PULSE © 2026 · POWERED BY CLAUDE AI WITH LIVE WEB SEARCH · ALL STORIES FETCHED IN REAL TIME</footer>

<script>
// ── Calls our own server proxy at /api/news — no API key needed here ──
const PROXY = '/api/news';

function clock() {
  const n = new Date();
  document.getElementById('clock').textContent =
    n.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}) +
    ' · ' + n.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}
setInterval(clock, 1000); clock();

function tagClass(cat) {
  if (!cat) return 'tag tag-default';
  const key = cat.toLowerCase().replace(/\s+/g,'-');
  const known = ['world','politics','technology','business','science','health','climate','ai','sports','entertainment'];
  return 'tag tag-' + (known.includes(key) ? key : 'default');
}

function showLoading(el) {
  el.innerHTML = `<div class="loading-state">
    <div class="spinner"></div>
    <div class="loading-text">SCANNING GLOBAL FEEDS…</div>
  </div>`;
}

async function fetchNews(cat, query) {
  const heroEl = document.getElementById('heroSection');
  const gridEl = document.getElementById('gridSection');
  showLoading(heroEl);
  gridEl.innerHTML = '';

  const q = query
    ? query
    : cat === 'Top Stories'
      ? 'top breaking world news stories today across all regions — include politics, economy, conflicts, science, technology'
      : `latest ${cat} news stories today worldwide — give diverse geographic coverage`;

  const systemPrompt = `You are a world-class news editor with live web search access. Search for the most current and significant news right now.
Return ONLY a raw JSON array. No markdown. No backticks. No explanation. Just the JSON array.
Return exactly 9 objects. Each object:
{
  "title": "compelling news headline",
  "category": "exactly one of: World, Politics, Technology, Business, Science, Health, Climate, AI, Sports, Entertainment",
  "summary": "2-3 sentence summary of the story",
  "detail": "4-6 sentences with key facts, context, quotes if available, and implications",
  "source": "publication name",
  "sourceUrl": "full article URL or empty string if unknown",
  "region": "country or region e.g. United States, Europe, Middle East",
  "time": "how long ago e.g. 30 minutes ago, 2 hours ago, Today"
}
Prioritize: recency (last 24 hours), global geographic variety, factual accuracy.`;

  try {
    const res = await fetch(PROXY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system: systemPrompt,
        messages: [{ role: 'user', content: `Search the web and return the JSON array for: ${q}` }]
      })
    });

    if (!res.ok) {
      const err = await res.text();
      throw new Error(`Server error ${res.status}: ${err.slice(0,200)}`);
    }

    const data = await res.json();

    // Extract all text blocks (Claude may return text after tool_use blocks)
    let raw = '';
    for (const block of (data.content || [])) {
      if (block.type === 'text') raw += block.text;
    }

    const match = raw.match(/\[[\s\S]*\]/);
    if (!match) throw new Error('No JSON array found in response');

    const articles = JSON.parse(match[0]);
    if (!Array.isArray(articles) || articles.length === 0) throw new Error('Empty articles array');

    render(articles);

  } catch (err) {
    console.error(err);
    heroEl.innerHTML = `
      <div class="error-box">
        <div class="big">Could not load news</div>
        <p>${err.message}</p>
        <p style="margin-top:0.8rem">Make sure your <strong>.env</strong> file has a valid ANTHROPIC_API_KEY and restart the server.</p>
      </div>`;
    gridEl.innerHTML = '';
  }
}

function render(arts) {
  if (!arts?.length) return;
  const [lead, ...rest] = arts;
  const heroEl = document.getElementById('heroSection');

  heroEl.innerHTML = `
    <div class="hero-grid">
      <div class="hero-main" id="heroMain">
        <span class="${tagClass(lead.category)}">${lead.category}</span>
        <div class="hero-headline">${esc(lead.title)}</div>
        <div class="hero-meta">${esc(lead.region)} · ${esc(lead.source)} · ${esc(lead.time)}</div>
        <div class="hero-summary">${esc(lead.summary)}</div>
      </div>
      <div class="hero-side">
        ${rest.slice(0,3).map((a,i) => `
          <div class="hero-side-item" data-si="${i}">
            <span class="${tagClass(a.category)}">${esc(a.category)}</span>
            <div class="side-headline">${esc(a.title)}</div>
            <div class="side-meta">${esc(a.region)} · ${esc(a.time)}</div>
          </div>`).join('')}
      </div>
    </div>`;

  document.getElementById('heroMain').onclick = () => openModal(lead);
  rest.slice(0,3).forEach((a,i) => {
    document.querySelector(`[data-si="${i}"]`).onclick = () => openModal(a);
  });

  const grid = rest.slice(3);
  if (grid.length) {
    document.getElementById('gridSection').innerHTML =
      `<div class="news-grid">${grid.map((a,i) => `
        <div class="news-card" data-gi="${i}">
          <span class="${tagClass(a.category)}">${esc(a.category)}</span>
          <div class="card-headline">${esc(a.title)}</div>
          <div class="card-summary">${esc(a.summary)}</div>
          <div class="card-meta">${esc(a.region)} · ${esc(a.source)} · ${esc(a.time)}</div>
          ${a.sourceUrl ? `<a class="card-link" href="${a.sourceUrl}" target="_blank" onclick="event.stopPropagation()">↗ Read original</a>` : ''}
        </div>`).join('')}
      </div>`;
    grid.forEach((a,i) => {
      document.querySelector(`[data-gi="${i}"]`).onclick = () => openModal(a);
    });
  }

  // Update ticker
  document.getElementById('ticker').textContent =
    (arts.map(a => a.title + '  ◆  ').join('') + ' ').repeat(4);
}

function openModal(a) {
  document.getElementById('modalContent').innerHTML = `
    <span class="${tagClass(a.category)}">${esc(a.category)}</span>
    <div class="modal-title">${esc(a.title)}</div>
    <div class="modal-meta">${esc(a.region)} · ${esc(a.source)} · ${esc(a.time)}</div>
    <div class="modal-body">
      <p>${esc(a.summary)}</p>
      <p>${esc(a.detail)}</p>
    </div>
    <div class="modal-source">Source: ${
      a.sourceUrl
        ? `<a href="${a.sourceUrl}" target="_blank">${esc(a.source)}</a>`
        : esc(a.source)
    }</div>`;
  document.getElementById('modalOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  document.body.style.overflow = '';
}
document.getElementById('modalOverlay').onclick = e => {
  if (e.target.id === 'modalOverlay') closeModal();
};
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// Escape HTML to prevent XSS
function esc(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Category tabs
document.getElementById('catRibbon').addEventListener('click', e => {
  const btn = e.target.closest('.cat-btn');
  if (!btn) return;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('moreLabel').textContent = btn.dataset.cat.toUpperCase() + ' STORIES';
  fetchNews(btn.dataset.cat);
});

// Search
function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  document.getElementById('moreLabel').textContent = `RESULTS FOR "${q.toUpperCase()}"`;
  fetchNews(null, q);
}
document.getElementById('searchInput').onkeydown = e => {
  if (e.key === 'Enter') doSearch();
};

// Boot
fetchNews('Top Stories');
</script>
</body>
</html>
