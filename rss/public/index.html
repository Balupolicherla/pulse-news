<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PULSE — RSS Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root { --ink:#0d0d0d;--paper:#f5f0e8;--cream:#ede8dc;--accent:#c0392b;--muted:#888070;--divider:#d4cfc4;--card:#faf7f2; }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;}
  header{border-bottom:3px double var(--ink);padding:0 2rem;background:var(--paper);position:sticky;top:0;z-index:200;}
  .top-bar{display:flex;align-items:center;justify-content:space-between;padding:.45rem 0;border-bottom:1px solid var(--divider);font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);letter-spacing:.07em;}
  .live-wrap{display:flex;align-items:center;gap:5px;}
  .live-dot{width:7px;height:7px;background:var(--accent);border-radius:50%;animation:blink 1.4s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  .src-badge{background:var(--accent);color:#fff;font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.1em;padding:2px 8px;border-radius:2px;}
  .masthead{text-align:center;padding:.75rem 0 .45rem;}
  .masthead h1{font-family:'Playfair Display',serif;font-size:clamp(2.4rem,6vw,5rem);font-weight:900;letter-spacing:-.02em;line-height:1;}
  .masthead h1 em{color:var(--accent);font-style:normal;}
  .tagline{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin-top:2px;}
  .cats{display:flex;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--divider);margin-top:.35rem;}
  .cats::-webkit-scrollbar{display:none}
  .cat{flex-shrink:0;padding:.45rem .95rem;font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;background:none;border:none;border-right:1px solid var(--divider);color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap;}
  .cat:hover{background:var(--cream);color:var(--ink);}
  .cat.on{background:var(--ink);color:var(--paper);}
  .ticker{background:var(--ink);color:var(--paper);overflow:hidden;white-space:nowrap;padding:.4rem 0;margin-bottom:1.2rem;}
  .ticker-tag{display:inline-block;background:var(--accent);font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;padding:0 .7rem;margin-right:.6rem;}
  .ticker-scroll{display:inline-block;animation:scroll 80s linear infinite;font-family:'DM Mono',monospace;font-size:.7rem;padding-left:100%;}
  @keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
  main{max-width:1380px;margin:0 auto;padding:1.2rem 1.5rem 4rem;}
  .search{display:flex;margin-bottom:1.3rem;border:2px solid var(--ink);max-width:560px;}
  .search input{flex:1;padding:.6rem .9rem;font-family:'DM Sans',sans-serif;font-size:.88rem;border:none;background:var(--card);color:var(--ink);outline:none;}
  .search input::placeholder{color:var(--muted);}
  .search button{padding:.6rem 1.1rem;background:var(--ink);color:var(--paper);border:none;font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.08em;cursor:pointer;transition:background .15s;white-space:nowrap;}
  .search button:hover{background:var(--accent);}
  .hero{display:grid;grid-template-columns:1fr 290px;border:1px solid var(--divider);margin-bottom:1.8rem;background:var(--card);}
  .hero-main{padding:1.6rem;border-right:1px solid var(--divider);cursor:pointer;transition:background .15s;}
  .hero-main:hover{background:var(--cream);}
  .hero-img{width:100%;height:200px;object-fit:cover;margin-bottom:1rem;display:block;}
  .hero-side{display:flex;flex-direction:column;}
  .side-item{padding:.9rem 1rem;border-bottom:1px solid var(--divider);cursor:pointer;transition:background .15s;flex:1;display:flex;flex-direction:column;gap:4px;}
  .side-item:last-child{border-bottom:none;}
  .side-item:hover{background:var(--cream);}
  .tag{display:inline-block;font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:#fff;padding:2px 6px;border-radius:2px;margin-bottom:.4rem;}
  .tag-world{background:#2c3e50}.tag-politics{background:#2980b9}.tag-technology{background:#27ae60}
  .tag-business{background:#8e44ad}.tag-science{background:#16a085}.tag-health{background:#c0392b}
  .tag-climate{background:#1abc9c}.tag-ai{background:#6c3483}.tag-sports{background:#e67e22}
  .tag-entertainment{background:#d35400}.tag-global{background:#7f8c8d}.tag-default{background:#7f8c8d}
  .big-head{font-family:'Playfair Display',serif;font-size:clamp(1.3rem,2.4vw,2.1rem);font-weight:700;line-height:1.25;margin-bottom:.5rem;}
  .med-head{font-family:'Playfair Display',serif;font-size:.92rem;font-weight:700;line-height:1.35;}
  .meta{font-family:'DM Mono',monospace;font-size:.64rem;color:var(--muted);letter-spacing:.04em;}
  .summ{font-size:.9rem;line-height:1.65;color:#3a3530;margin-top:.4rem;}
  .section-label{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);border-top:2.5px solid var(--ink);padding-top:.45rem;margin-bottom:.9rem;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1px;background:var(--divider);border:1px solid var(--divider);margin-bottom:2rem;}
  .card{background:var(--card);padding:1.1rem;cursor:pointer;transition:background .15s;display:flex;flex-direction:column;gap:5px;}
  .card:hover{background:var(--cream);}
  .card-img{width:100%;height:130px;object-fit:cover;margin-bottom:6px;}
  .card-head{font-family:'Playfair Display',serif;font-size:.97rem;font-weight:700;line-height:1.38;color:var(--ink);}
  .card-summ{font-size:.82rem;line-height:1.58;color:#4a4540;flex:1;}
  .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5rem 2rem;gap:.9rem;}
  .spin{width:34px;height:34px;border:3px solid var(--divider);border-top-color:var(--ink);border-radius:50%;animation:spin .75s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .load-txt{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted);letter-spacing:.1em;}
  .overlay{display:none;position:fixed;inset:0;background:rgba(13,13,13,.65);z-index:999;align-items:center;justify-content:center;padding:1rem;}
  .overlay.on{display:flex;}
  .modal{background:var(--paper);border:2px solid var(--ink);max-width:680px;width:100%;max-height:88vh;overflow-y:auto;padding:1.8rem;position:relative;animation:up .22s ease;}
  @keyframes up{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal-x{position:absolute;top:.9rem;right:1.1rem;background:none;border:none;font-size:1.35rem;cursor:pointer;color:var(--muted);}
  .modal-img{width:100%;max-height:240px;object-fit:cover;margin:.6rem 0 1rem;}
  .modal-title{font-family:'Playfair Display',serif;font-size:clamp(1.2rem,2.4vw,1.75rem);font-weight:700;line-height:1.3;margin:.5rem 0;}
  .modal-meta{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);margin-bottom:1rem;}
  .modal-body{font-size:.94rem;line-height:1.78;color:#2a2520;border-top:1px solid var(--divider);padding-top:.9rem;}
  .modal-link{display:inline-block;margin-top:1.1rem;padding:.55rem 1.2rem;background:var(--ink);color:var(--paper);font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.08em;text-decoration:none;transition:background .15s;}
  .modal-link:hover{background:var(--accent);}
  .err{padding:2.5rem;text-align:center;border:1px solid var(--divider);background:var(--card);}
  .err-title{font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--accent);margin-bottom:.5rem;}
  .err-msg{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--muted);line-height:1.7;}
  .empty{padding:3rem;text-align:center;font-family:'DM Mono',monospace;font-size:.8rem;color:var(--muted);letter-spacing:.08em;}
  footer{border-top:3px double var(--ink);padding:1.1rem 2rem;text-align:center;font-family:'DM Mono',monospace;font-size:.65rem;color:var(--muted);letter-spacing:.08em;}
  @media(max-width:820px){.hero{grid-template-columns:1fr}.hero-main{border-right:none;border-bottom:1px solid var(--divider)}.hero-side{flex-direction:row;overflow-x:auto}.side-item{min-width:200px;border-right:1px solid var(--divider);border-bottom:none}}
  @media(max-width:540px){header{padding:0 1rem}main{padding:1rem 1rem 3rem}.hero-side{flex-direction:column}.side-item{min-width:unset;border-right:none;border-bottom:1px solid var(--divider)}}
</style>
</head>
<body>
<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <button class="modal-x" id="modalX">✕</button>
    <div id="modalBody"></div>
  </div>
</div>
<header>
  <div class="top-bar">
    <div class="live-wrap"><div class="live-dot"></div><span>LIVE</span></div>
    <span id="clock">—</span>
    <span class="src-badge">FREE RSS</span>
  </div>
  <div class="masthead">
    <h1>PUL<em>S</em>E</h1>
    <div class="tagline">BBC · Reuters · Guardian · NY Times · No API Key</div>
  </div>
  <div class="cats" id="cats">
    <button class="cat on" data-cat="Top Stories">Top Stories</button>
    <button class="cat" data-cat="World">World</button>
    <button class="cat" data-cat="Politics">Politics</button>
    <button class="cat" data-cat="Technology">Technology</button>
    <button class="cat" data-cat="Business">Business</button>
    <button class="cat" data-cat="Science">Science</button>
    <button class="cat" data-cat="Health">Health</button>
    <button class="cat" data-cat="Climate">Climate</button>
    <button class="cat" data-cat="AI">AI</button>
    <button class="cat" data-cat="Sports">Sports</button>
    <button class="cat" data-cat="Entertainment">Entertainment</button>
  </div>
</header>
<div class="ticker"><span class="ticker-tag">BREAKING</span><span class="ticker-scroll" id="ticker">Loading…</span></div>
<main>
  <div class="search">
    <input id="q" type="text" placeholder="Search any topic…"/>
    <button id="sb">SEARCH</button>
  </div>
  <div id="hero"></div>
  <div class="section-label" id="ml">MORE STORIES</div>
  <div id="grid"></div>
</main>
<footer>PULSE · BBC News, Reuters, The Guardian, NY Times, TechCrunch · 100% Free · No API Key</footer>
<script>
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function tagCls(c){const m={World:'world',Politics:'politics',Technology:'technology',Business:'business',Science:'science',Health:'health',Climate:'climate',AI:'ai',Sports:'sports',Entertainment:'entertainment',Global:'global'};return'tag tag-'+(m[c]||'default')}
function tick(){const n=new Date();document.getElementById('clock').textContent=n.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+' · '+n.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}
setInterval(tick,1000);tick();
function showLoad(el){el.innerHTML='<div class="loading"><div class="spin"></div><div class="load-txt">FETCHING LIVE NEWS…</div></div>'}
async function load(cat,q){
  const he=document.getElementById('hero'),gr=document.getElementById('grid');
  showLoad(he);gr.innerHTML='';
  const url=q?`/api/news?q=${encodeURIComponent(q)}`:`/api/news?category=${encodeURIComponent(cat)}`;
  try{
    const r=await fetch(url);if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const{articles,error}=await r.json();
    if(error)throw new Error(error);
    if(!articles||!articles.length){he.innerHTML='<div class="empty">NO RESULTS — TRY A DIFFERENT TERM</div>';return;}
    render(articles);
  }catch(e){he.innerHTML=`<div class="err"><div class="err-title">Could not load news</div><div class="err-msg">${esc(e.message)}</div></div>`;}
}
function render(arts){
  const[lead,...rest]=arts;
  const he=document.getElementById('hero');
  he.innerHTML=`<div class="hero"><div class="hero-main" id="hm">${lead.image?`<img class="hero-img" src="${esc(lead.image)}" alt="" onerror="this.style.display='none'"/>`:''}
    <span class="${tagCls(lead.category)}">${esc(lead.category)}</span>
    <div class="big-head">${esc(lead.title)}</div>
    <div class="meta">${esc(lead.source)} · ${esc(lead.region)} · ${esc(lead.pubDate)}</div>
    ${lead.summary?`<div class="summ">${esc(lead.summary)}</div>`:''}</div>
    <div class="hero-side">${rest.slice(0,3).map((a,i)=>`<div class="side-item" data-si="${i}"><span class="${tagCls(a.category)}">${esc(a.category)}</span><div class="med-head">${esc(a.title)}</div><div class="meta">${esc(a.source)} · ${esc(a.pubDate)}</div></div>`).join('')}</div></div>`;
  document.getElementById('hm').onclick=()=>openModal(lead);
  rest.slice(0,3).forEach((a,i)=>{document.querySelector(`[data-si="${i}"]`).onclick=()=>openModal(a);});
  const g=rest.slice(3);
  if(g.length){document.getElementById('grid').innerHTML=`<div class="grid">${g.map((a,i)=>`<div class="card" data-gi="${i}">${a.image?`<img class="card-img" src="${esc(a.image)}" alt="" onerror="this.style.display='none'"/>`:''}
    <span class="${tagCls(a.category)}">${esc(a.category)}</span><div class="card-head">${esc(a.title)}</div>
    ${a.summary?`<div class="card-summ">${esc(a.summary)}</div>`:''}<div class="meta">${esc(a.source)} · ${esc(a.region)} · ${esc(a.pubDate)}</div></div>`).join('')}</div>`;
    g.forEach((a,i)=>{document.querySelector(`[data-gi="${i}"]`).onclick=()=>openModal(a);});}
  document.getElementById('ticker').textContent=(arts.map(a=>a.title+'  ◆  ').join('')).repeat(3);
}
function openModal(a){
  document.getElementById('modalBody').innerHTML=`<span class="${tagCls(a.category)}">${esc(a.category)}</span>
    ${a.image?`<img class="modal-img" src="${esc(a.image)}" alt="" onerror="this.style.display='none'"/>`:''}
    <div class="modal-title">${esc(a.title)}</div>
    <div class="modal-meta">${esc(a.source)} · ${esc(a.region)} · ${esc(a.pubDate)}</div>
    <div class="modal-body">${esc(a.summary)||'Click below to read the full story.'}</div>
    ${a.link?`<a class="modal-link" href="${esc(a.link)}" target="_blank" rel="noopener">READ FULL STORY ↗</a>`:''}`;
  document.getElementById('overlay').classList.add('on');
  document.body.style.overflow='hidden';
}
function closeModal(){document.getElementById('overlay').classList.remove('on');document.body.style.overflow='';}
document.getElementById('modalX').onclick=closeModal;
document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeModal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
document.getElementById('cats').addEventListener('click',e=>{
  const b=e.target.closest('.cat');if(!b)return;
  document.querySelectorAll('.cat').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  document.getElementById('ml').textContent=b.dataset.cat.toUpperCase()+' STORIES';
  load(b.dataset.cat,'');
});
document.getElementById('sb').onclick=()=>{const q=document.getElementById('q').value.trim();if(!q)return;document.getElementById('ml').textContent=`RESULTS FOR "${q.toUpperCase()}"`;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('on'));load('',q);};
document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')document.getElementById('sb').click();};
load('Top Stories','');
</script>
</body>
</html>
