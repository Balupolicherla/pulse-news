version: "3.9"

services:
  pulse-news:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulse-news
    ports:
      - "3000:3000"
    env_file:
      - .env                  # reads your ANTHROPIC_API_KEY
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
